$mainMod = SUPER
$ipc = qs -c noctalia-shell ipc call

# PROGRAMS
$terminal = uwsm-app -- kitty
$fileManager = uwsm-app -- kitty -e yazi
$appLauncher = uwsm-app -- walker
$browser = uwsm-app -- librewolf
$powerMenu = $ipc sessionMenu toggle
$settings = $ipc settings toggle

# ACTIONS
bind = $mainMod, C, killactive # Close active window
bind = $mainMod SHIFT, C, forcekillactive # Kill active window
bind = $mainMod, V, exec, $appLauncher -m clipboard 
bind = $mainMod, F, fullscreenstate, 1, 1, toggle # Maximise window
bind = $mainMod SHIFT, F, fullscreenstate, 2, 2, toggle # Fullscreen's window
bind = $mainMod, Tab, cyclenext

# LAUNCHING STUFF
bind = $mainMod, T, exec, $terminal
bind = $mainMod, E,	exec, $fileManager
bind = $mainMod, B,	exec, $browser
bind = $mainMod, R,	exec, $appLauncher
bind = $mainMod, I,	exec, $settings
bind = $mainMod, M, exec, $powerMenu
bind = $mainMod, O, exec, kitty -e nmtui

# MOVE FOCUS USING ARROW KEYS
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# MOVE WINDOW USING ARROW KEYS
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# MOVE/RESIZE WINDOWS
bindm = $mainMod, mouse:272, movewindow # LEFT CLICK --> MOVE
bindm = $mainMod, mouse:273, resizewindow # RIGHT CLICK --> RESIZE

# SWITCH WORKSPACES [1-10]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, mouse:274, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

gesture = 3, horizontal, workspace

# GESTURES
gesture = 3, down, dispatcher, exec, hyprshot -z -s -m region --clipboard-only
gesture = 4, down, dispatcher, exec, hyprshot -z -s -m region -o ~/Pictures/captures -f $(date +%H-%M_%d-%m-%Y)

# MOVE WINDOW TO WORKSPACE [1-9]
bind = $mainMod SHIFT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT, 0, movetoworkspacesilent, 10

# VOLUME
bindel = ,XF86AudioRaiseVolume, exec, $ipc volume increase
bindel = ,XF86AudioLowerVolume, exec, $ipc volume decrease
bindel = ,XF86AudioMute, exec, $ipc volume muteOutput

# BRIGHTNESS
bindel = ,XF86MonBrightnessUp, exec, $ipc brightness increase
bindel = ,XF86MonBrightnessDown, exec, $ipc brightness decrease

# MEDIA
bindel = ,XF86AudioPlay, exec, $ipc media playPause
